name: psana_env
channels:
 - defaults
 - lcls-i
 - conda-forge
 - cctbx
dependencies:
# Don't do these -- they interfere with NERSC systems
# # conda compilers
# - c-compiler
# - cxx-compiler

 # compilers
 - scons

 # psana
 - psana

 # python
 - python=3.11
 - biopython
 - ipython
 - pybind11
 - setuptools<60
 - msgpack-cxx

 # testing
 - pytest
 - pytest-xdist
 - mock

 # documentation
 - docutils
 - numpydoc
 - sphinx

 # graphics
 - pillow
 - reportlab
 - wxpython
 - pyopengl
 - libtiff

 # HDF5 (main libraries come with psana)
 - conda-forge::hdf5
 - conda-forge::h5py
 - conda-forge::hdf5plugin

 # other
 - libsvm
 - mrcfile
 - psutil
 - conda-forge::nxmx
 - conda-forge::ncurses # avoid "libtinfo.so unknown version" error

 # cctbx channel
 - libsvm_py

 # dials
 - jinja2
 - msgpack-python
 - ordered-set
 - python-blosc
 - scikit-learn
 - tqdm
 - eigen
 - dials-data
 - pint
 - nxmx
 - gemmi
 - hatchling
 - editables

 # dxtbx
 - natsort

 # xia2
 - tabulate

 # Phenix
 - send2trash
 - PyRTF

 # xfel gui
 - mysql
 - mysql-connector-python
 - mysql-connector-c
 - mysqlclient
 - sqlite

 - pybind11
 - pandas
 - pydrive2

 # Avoid numpy 1.21.[01234]
 # See https://github.com/cctbx/cctbx_project/issues/627
 - numpy=1.20|>=1.21.5
